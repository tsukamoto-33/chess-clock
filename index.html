<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>チェスクロック</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111827;
      color: #f9fafb;
      font-synthesis: none;
      -webkit-tap-highlight-color: transparent;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      background: #111827;
    }

    button, input, select { font: inherit; }

    .app {
      width: min(100%, 900px);
      height: 100vh;
      height: 100dvh;
      min-height: 320px;
      margin: 0 auto;
      padding: max(10px, env(safe-area-inset-top)) 14px max(10px, env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    header {
      min-height: 38px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    h1 { margin: 0; font-size: 1.1rem; }

    .status {
      color: #a5b4fc;
      font-size: .9rem;
      text-align: right;
    }

    .status[data-kind="warning"] { color: #fbbf24; }
    .status[data-kind="over"] { color: #fca5a5; }

    .clocks {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .clock {
      min-width: 0;
      border: 2px solid #374151;
      border-radius: 20px;
      color: #f9fafb;
      background: #1f2937;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
      transition: background .15s, border-color .15s, transform .12s;
    }

    .clock:active { transform: scale(.99); }
    .clock.active { border-color: #818cf8; background: #25314a; }

    .clock.running::after {
      content: "● 計測中";
      color: #a5b4fc;
      font-size: .8rem;
    }

    .clock.expired {
      border-color: #ef4444;
      background: #451a1a;
    }

    .clock.expired .time,
    .clock.expired .sub-time {
      color: #fca5a5;
    }

    .player {
      color: #cbd5e1;
      font-size: clamp(.85rem, 3vw, 1.1rem);
    }

    .time, .sub-time {
      font-variant-numeric: tabular-nums;
      text-align: center;
    }

    .time {
      font-size: clamp(2.4rem, 12vw, 5.6rem);
      line-height: 1.05;
      font-weight: 750;
      letter-spacing: .02em;
    }

    .sub-time {
      color: #cbd5e1;
      font-size: clamp(.75rem, 3vw, 1rem);
    }

    .sub-time[hidden] { display: none; }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 9px;
    }

    .controls button,
    .settings-button,
    .dialog-actions button {
      min-height: 46px;
      border: 0;
      border-radius: 13px;
      background: #374151;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }

    .controls button.primary,
    .dialog-actions .save {
      background: #4f46e5;
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .settings-button {
      width: 100%;
      min-height: 40px;
      background: transparent;
      border: 1px solid #4b5563;
    }

    .help {
      margin: 0;
      text-align: center;
      color: #9ca3af;
      font-size: .76rem;
    }

    dialog {
      width: min(92vw, 450px);
      max-height: 90dvh;
      overflow: auto;
      border: 1px solid #4b5563;
      border-radius: 20px;
      padding: 20px;
      background: #1f2937;
      color: #f9fafb;
    }

    dialog::backdrop { background: rgb(0 0 0 / 68%); }
    dialog h2 { margin: 0 0 16px; font-size: 1.25rem; }

    .field { margin: 14px 0; }

    .field > label,
    .field > .field-label {
      display: block;
      margin-bottom: 7px;
      color: #e5e7eb;
    }

    .time-input {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .time-input input {
      width: 50%;
      min-width: 0;
      height: 42px;
      border: 1px solid #6b7280;
      border-radius: 10px;
      padding: 8px;
      background: #111827;
      color: #fff;
      text-align: center;
      font-size: 1.05rem;
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .check-row input {
      width: 22px;
      height: 22px;
      accent-color: #6366f1;
    }

    select {
      width: 100%;
      min-height: 44px;
      border: 1px solid #6b7280;
      border-radius: 10px;
      padding: 8px;
      color: #fff;
      background: #111827;
    }

    .dialog-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .dialog-actions button { flex: 1; }
    .error { min-height: 1.2em; color: #fca5a5; font-size: .88rem; }

    @media (max-width: 360px) {
      .app { padding-left: 8px; padding-right: 8px; gap: 6px; }
      .clocks { gap: 6px; }
      .clock { border-radius: 15px; }
      .time { font-size: clamp(2rem, 11vw, 3rem); }
      .controls { gap: 6px; }
      .controls button { min-height: 42px; font-size: .9rem; }
    }

    @media (max-height: 460px) {
      .app { gap: 5px; }
      header { min-height: 28px; }
      .clock { border-radius: 14px; gap: 4px; }
      .time { font-size: clamp(2rem, 8vw, 3.6rem); }
      .controls button { min-height: 39px; }
      .settings-button { min-height: 34px; }
      .help { font-size: .68rem; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>♟ チェスクロック</h1>
      <div id="status" class="status" aria-live="polite">待機中</div>
    </header>

    <section class="clocks" aria-label="プレイヤーの時計">
      <button class="clock" id="clock0" type="button" aria-label="プレイヤー1の時計">
        <span class="player">プレイヤー 1</span>
        <span class="time" id="mainTime0">05:00</span>
        <span class="sub-time" id="subTime0" hidden>サブ 00:00</span>
      </button>

      <button class="clock" id="clock1" type="button" aria-label="プレイヤー2の時計">
        <span class="player">プレイヤー 2</span>
        <span class="time" id="mainTime1">05:00</span>
        <span class="sub-time" id="subTime1" hidden>サブ 00:00</span>
      </button>
    </section>

    <section class="controls" aria-label="対局操作">
      <button class="primary" id="startButton" type="button">開始</button>
      <button id="pauseButton" type="button">一時停止</button>
      <button id="resetButton" type="button">リセット</button>
    </section>

    <button class="settings-button" id="settingsButton" type="button">時間・表示設定</button>
    <p class="help">対局中は、左右どちらの時計をタップしても手番が切り替わります。</p>
  </main>

  <dialog id="settingsDialog">
    <form id="settingsForm">
      <h2>時間・表示設定</h2>

      <div class="field">
        <label for="mainMin">各手番のメイン時間</label>
        <div class="time-input">
          <input id="mainMin" type="number" min="0" max="599" step="1" inputmode="numeric" aria-label="メイン時間の分">
          <span>分</span>
          <input id="mainSec" type="number" min="0" max="59" step="1" inputmode="numeric" aria-label="メイン時間の秒">
          <span>秒</span>
        </div>
      </div>

      <div class="field">
        <label class="check-row">
          <input id="subEnabled" type="checkbox">
          サブ時間を使う
        </label>
      </div>

      <div class="field">
        <label for="subMode">サブ時間の方式</label>
        <select id="subMode">
          <option value="down">カウントダウン（設定時間から減る）</option>
          <option value="up">カウントアップ（0から目標まで増える）</option>
        </select>
      </div>

      <div class="field">
        <label for="sub1Min">プレイヤー 1 のサブ時間</label>
        <div class="time-input">
          <input id="sub1Min" type="number" min="0" max="599" step="1" inputmode="numeric" aria-label="プレイヤー1のサブ時間の分">
          <span>分</span>
          <input id="sub1Sec" type="number" min="0" max="59" step="1" inputmode="numeric" aria-label="プレイヤー1のサブ時間の秒">
          <span>秒</span>
        </div>
      </div>

      <div class="field">
        <label for="sub2Min">プレイヤー 2 のサブ時間</label>
        <div class="time-input">
          <input id="sub2Min" type="number" min="0" max="599" step="1" inputmode="numeric" aria-label="プレイヤー2のサブ時間の分">
          <span>分</span>
          <input id="sub2Sec" type="number" min="0" max="59" step="1" inputmode="numeric" aria-label="プレイヤー2のサブ時間の秒">
          <span>秒</span>
        </div>
      </div>

      <div class="field">
        <label class="check-row">
          <input id="soundEnabled" type="checkbox">
          手番切り替え時に効果音を鳴らす
        </label>
      </div>

      <p class="error" id="settingsError" aria-live="polite"></p>

      <div class="dialog-actions">
        <button type="button" id="cancelSettings">キャンセル</button>
        <button type="submit" class="save">保存</button>
      </div>
    </form>
  </dialog>

  <script>
    (() => {
      "use strict";

      const STORAGE_KEY = "chess-clock-settings-v3";
      const DEFAULTS = {
        mainMs: 5 * 60 * 1000,
        subEnabled: true,
        subMode: "down",
        subMs: [30 * 60 * 1000, 30 * 60 * 1000],
        soundEnabled: true
      };

      let settings = loadSettings();
      let mainRemaining = settings.mainMs;
      let subValues = initialSubValues();
      let activePlayer = 0;
      let running = false;
      let ended = false;
      let endReason = "";
      let lastTick = null;
      let tickHandle = null;
      let wakeLock = null;
      let audioContext = null;
      let vibrationWarned = false;

      const $ = (id) => document.getElementById(id);
      const clocks = [$("clock0"), $("clock1")];

      function isValidDuration(ms) {
        return Number.isInteger(ms) && ms >= 1000 && ms <= 36000000;
      }

      function loadSettings() {
        try {
          const value = JSON.parse(localStorage.getItem(STORAGE_KEY));

          if (value &&
              isValidDuration(value.mainMs) &&
              typeof value.subEnabled === "boolean" &&
              (value.subMode === "down" || value.subMode === "up") &&
              Array.isArray(value.subMs) &&
              value.subMs.length === 2 &&
              value.subMs.every(isValidDuration) &&
              typeof value.soundEnabled === "boolean") {
            return value;
          }
        } catch (_) {
          /* 設定データがない、または破損している場合は初期設定を使う */
        }

        return { ...DEFAULTS, subMs: [...DEFAULTS.subMs] };
      }

      function initialSubValues() {
        return settings.subMode === "down"
          ? [...settings.subMs]
          : [0, 0];
      }

      function formatTime(ms) {
        const seconds = Math.ceil(Math.max(0, ms) / 1000);
        const minutes = Math.floor(seconds / 60);

        return String(minutes).padStart(2, "0") + ":" +
          String(seconds % 60).padStart(2, "0");
      }

      function formatElapsed(ms) {
        const seconds = Math.floor(Math.max(0, ms) / 1000);
        const minutes = Math.floor(seconds / 60);

        return String(minutes).padStart(2, "0") + ":" +
          String(seconds % 60).padStart(2, "0");
      }

      function render() {
        // 手番側だけ残り時間を表示し、相手側には設定時間を表示する。
        $("mainTime0").textContent = formatTime(
          activePlayer === 0 ? mainRemaining : settings.mainMs
        );
        $("mainTime1").textContent = formatTime(
          activePlayer === 1 ? mainRemaining : settings.mainMs
        );

        for (let i = 0; i < 2; i++) {
          const sub = $("subTime" + i);
          sub.hidden = !settings.subEnabled;

          if (settings.subMode === "down") {
            sub.textContent = "サブ残り " + formatTime(subValues[i]);
          } else {
            sub.textContent = "サブ経過 " + formatElapsed(subValues[i]);
          }
        }

        clocks.forEach((clock, index) => {
          clock.classList.toggle("active", index === activePlayer && !ended);
          clock.classList.toggle("running", running && index === activePlayer);
          clock.classList.toggle("expired", ended && index === activePlayer);
        });

        const status = $("status");
        status.dataset.kind = ended ? "over" : running ? "warning" : "";

        if (ended) {
          status.textContent = endReason === "sub"
            ? "対局終了：プレイヤー " + (activePlayer + 1) + " のサブ時間切れ"
            : "対局終了：プレイヤー " + (activePlayer + 1) + " のメイン時間切れ";
        } else if (running) {
          status.textContent = "対局中 — プレイヤー " + (activePlayer + 1) + " の手番";
        } else {
          const hasProgress = mainRemaining !== settings.mainMs ||
            (settings.subMode === "down"
              ? subValues.some((value, index) => value !== settings.subMs[index])
              : subValues.some((value) => value > 0));

          status.textContent = hasProgress ? "一時停止中" : "待機中";
        }

        $("startButton").disabled = running || ended;
        $("startButton").textContent =
          $("status").textContent === "待機中" ? "開始" : "再開";
        $("pauseButton").disabled = !running;
        $("settingsButton").disabled = running;
      }

      function stopVibration() {
        if (!("vibrate" in navigator)) return;

        try {
          navigator.vibrate(0);
        } catch (_) {
          /* 振動停止に失敗しても時計の動作には影響させない */
        }
      }

      function vibrateWarning() {
        if (!("vibrate" in navigator)) return;

        try {
          navigator.vibrate(5000);
        } catch (_) {
          /* 非対応・ブラウザ制限時は振動なしで動作 */
        }
      }

      function finish(reason) {
        running = false;
        ended = true;
        endReason = reason;
        lastTick = null;

        clearInterval(tickHandle);
        tickHandle = null;
        stopVibration();
        releaseWakeLock();
        render();
      }

      function updateClock() {
        if (!running || lastTick === null) return;

        const now = Date.now();
        const elapsed = Math.max(0, now - lastTick);
        lastTick = now;

        const previousMainRemaining = mainRemaining;
        mainRemaining = Math.max(0, mainRemaining - elapsed);

        if (settings.subEnabled) {
          if (settings.subMode === "down") {
            subValues[activePlayer] =
              Math.max(0, subValues[activePlayer] - elapsed);
          } else {
            subValues[activePlayer] += elapsed;
          }
        }

        if (!vibrationWarned &&
            previousMainRemaining > 5000 &&
            mainRemaining <= 5000 &&
            mainRemaining > 0) {
          vibrationWarned = true;
          vibrateWarning();
        }

        if (mainRemaining <= 0) {
          finish("main");
          return;
        }

        if (settings.subEnabled &&
            settings.subMode === "down" &&
            subValues[activePlayer] <= 0) {
          finish("sub");
          return;
        }

        if (settings.subEnabled &&
            settings.subMode === "up" &&
            subValues[activePlayer] >= settings.subMs[activePlayer]) {
          subValues[activePlayer] = settings.subMs[activePlayer];
          finish("sub");
          return;
        }

        render();
      }

      function start() {
        if (running || ended) return;

        running = true;
        lastTick = Date.now();

        if (mainRemaining <= 5000 &&
            mainRemaining > 0 &&
            !vibrationWarned) {
          vibrationWarned = true;
          vibrateWarning();
        }

        tickHandle = setInterval(updateClock, 100);
        requestWakeLock();
        render();
      }

      function pause() {
        if (!running) return;

        updateClock();

        if (running) {
          running = false;
          lastTick = null;

          clearInterval(tickHandle);
          tickHandle = null;
          stopVibration();
          releaseWakeLock();
          render();
        }
      }

      // どちら側をタップしても、現在の手番から相手側へ切り替える。
      function switchPlayer() {
        if (!running || ended) return;

        updateClock();
        if (ended) return;

        activePlayer = 1 - activePlayer;
        mainRemaining = settings.mainMs;
        lastTick = Date.now();

        stopVibration();
        vibrationWarned = false;

        playSwitchSound();
        render();
      }

      function reset() {
        running = false;
        ended = false;
        endReason = "";
        mainRemaining = settings.mainMs;
        subValues = initialSubValues();
        activePlayer = 0;
        lastTick = null;
        vibrationWarned = false;

        clearInterval(tickHandle);
        tickHandle = null;
        stopVibration();
        releaseWakeLock();
        render();
      }

      function requestWakeLock() {
        if (!("wakeLock" in navigator)) return;

        navigator.wakeLock.request("screen").then((lock) => {
          wakeLock = lock;
          lock.addEventListener("release", () => {
            wakeLock = null;
          });
        }).catch(() => {
          /* 非対応・許可拒否時も時計は動作する */
        });
      }

      function releaseWakeLock() {
        if (!wakeLock) return;

        wakeLock.release().catch(() => {});
        wakeLock = null;
      }

      function playSwitchSound() {
        if (!settings.soundEnabled) return;

        try {
          const AudioContextClass =
            window.AudioContext || window.webkitAudioContext;

          if (!AudioContextClass) return;

          if (!audioContext) audioContext = new AudioContextClass();

          if (audioContext.state === "suspended") {
            audioContext.resume().catch(() => {});
          }

          const oscillator = audioContext.createOscillator();
          const gain = audioContext.createGain();
          const now = audioContext.currentTime;

          oscillator.type = "sine";
          oscillator.frequency.setValueAtTime(880, now);
          oscillator.frequency.exponentialRampToValueAtTime(660, now + 0.09);

          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.exponentialRampToValueAtTime(0.18, now + 0.01);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.13);

          oscillator.connect(gain);
          gain.connect(audioContext.destination);
          oscillator.start(now);
          oscillator.stop(now + 0.14);
        } catch (_) {
          /* 音声非対応・再生拒否の場合は無音で動作する */
        }
      }

      function openSettings() {
        if (running) return;

        $("mainMin").value = Math.floor(settings.mainMs / 60000);
        $("mainSec").value = Math.floor(settings.mainMs / 1000) % 60;

        [0, 1].forEach((index) => {
          const player = index + 1;
          $("sub" + player + "Min").value =
            Math.floor(settings.subMs[index] / 60000);
          $("sub" + player + "Sec").value =
            Math.floor(settings.subMs[index] / 1000) % 60;
        });

        $("subEnabled").checked = settings.subEnabled;
        $("subMode").value = settings.subMode;
        $("soundEnabled").checked = settings.soundEnabled;
        $("settingsError").textContent = "";
        $("settingsDialog").showModal();
      }

      function readDuration(minId, secId) {
        const minText = $(minId).value.trim();
        const secText = $(secId).value.trim();

        if (minText === "" || secText === "") return null;

        const minutes = Number(minText);
        const seconds = Number(secText);

        if (!Number.isInteger(minutes) || minutes < 0 || minutes > 599 ||
            !Number.isInteger(seconds) || seconds < 0 || seconds > 59) {
          return null;
        }

        const duration = (minutes * 60 + seconds) * 1000;
        return isValidDuration(duration) ? duration : null;
      }

      // どちらの時計をタップしても、同じ手番切り替え処理を呼び出す。
      clocks.forEach((clock) => {
        clock.addEventListener("click", switchPlayer);
      });

      $("startButton").addEventListener("click", start);
      $("pauseButton").addEventListener("click", pause);
      $("settingsButton").addEventListener("click", openSettings);

      $("cancelSettings").addEventListener("click", () => {
        $("settingsDialog").close();
      });

      $("resetButton").addEventListener("click", () => {
        if (running &&
            !window.confirm("対局中です。時間をリセットしてよろしいですか？")) {
          return;
        }

        reset();
      });

      $("settingsForm").addEventListener("submit", (event) => {
        event.preventDefault();

        const mainMs = readDuration("mainMin", "mainSec");
        const sub1 = readDuration("sub1Min", "sub1Sec");
        const sub2 = readDuration("sub2Min", "sub2Sec");

        if (mainMs === null || sub1 === null || sub2 === null) {
          $("settingsError").textContent =
            "各時間は1秒以上、分は0〜599、秒は0〜59で入力してください。";
          return;
        }

        settings = {
          mainMs,
          subEnabled: $("subEnabled").checked,
          subMode: $("subMode").value,
          subMs: [sub1, sub2],
          soundEnabled: $("soundEnabled").checked
        };

        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
        } catch (_) {
          /* 保存できなくても、このページ上では新しい設定を使用する */
        }

        $("settingsDialog").close();
        reset();
      });

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible" && running) {
          updateClock();
          if (running) requestWakeLock();
        }
      });

      render();
    })();
  </script>
</body>
</html>
